---
mongodb_major: "6.0"
mongodb_full: "6.0.19"        
mongodb_repo_codename: jammy

mongodb_port: 27017
mongodb_replset: rs0
mongodb_keyfile: /etc/mongodb/mongo-keyfile

mongodb_admin_user: admin
mongodb_admin_password: "{{ lookup('env', 'MONGODB_ADMIN_PASSWORD') }}"

mongodb_pkgs:
  - mongodb-org
  - mongodb-org-database
  - mongodb-org-server
  - mongodb-org-mongos
  - mongodb-org-tools

mongodb_host_list: "{{ groups['mongodb'] | map('extract', hostvars, 'ansible_host') | map('regex_replace', '$', ':' ~ mongodb_port) | list }}"

mongosh_auth:
  - mongosh
  - --quiet
  - --port
  - "{{ mongodb_port }}"
  - -u
  - "{{ mongodb_admin_user }}"
  - -p
  - "{{ mongodb_admin_password }}"
  - --authenticationDatabase
  - admin


mongodb_target_major: "7.0"
mongodb_target_full: "7.0.48"

mongodb_health_js: |
  const m = rs.status().members;
  const n = {{ groups['mongodb'] | length }};
  const ok = m.length === n && m.every(x => x.health === 1)
             && m.filter(x => x.state === 1).length === 1
             && m.filter(x => x.state === 2).length === n - 1;
  print(ok ? "HEALTHY" : "UNHEALTHY");
  m.forEach(x => print(x.name + "  " + x.stateStr + "  health=" + x.health));
